name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Download Godot 4.2 stable
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2-stable/Godot_v4.2-stable_linux.x86_64.zip
          unzip Godot_v4.2-stable_linux.x86_64.zip
          mv Godot_v4.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2-stable/Godot_v4.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.stable
          unzip Godot_v4.2-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.2.stable
          mv ~/.local/share/godot/export_templates/4.2.stable/templates/* ~/.local/share/godot/export_templates/4.2.stable/
          rm -rf ~/.local/share/godot/export_templates/4.2.stable/templates

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Export APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          ./godot --headless --path . --export-debug "Android" "EchoLab.apk"

      - name: List files
        run: |
          ls -la
          ls -la *.apk || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoLab-APK
          path: EchoLab.apk
